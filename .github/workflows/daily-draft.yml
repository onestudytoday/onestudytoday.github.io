name: Draft today's post

# Runs every weekday morning. Sources studies for the day's niche, vets them,
# drafts the carousel, renders the slides, commits everything, and opens a
# GitHub issue you can review from your phone.
#
# It NEVER publishes. Publishing happens when you comment "approve" on the
# issue, which fires publish-on-approve.yml.

on:
  schedule:
    # 11:00 UTC = 06:00 America/Chicago (CDT). Adjust for your own timezone.
    # Mon Nature · Tue Mind · Wed Health · Thu Space · Fri Wildcard
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      niche:
        description: "Force a niche (leave blank for today's)"
        required: false
        type: choice
        options: ["", "nature", "psych", "health", "physics", "wildcard"]
      days:
        description: "Recency window in days"
        required: false
        default: "14"

permissions:
  contents: write
  issues: write

concurrency:
  group: draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # ubuntu-latest ships with ffmpeg, but "ships with" is a property of an
      # image that Actions rerolls without asking. If it ever stops being true,
      # reel building fails soft (src/pipeline.py catches it) and every Friday
      # quietly goes out as a carousel forever - a silent downgrade of the one
      # format that reaches non-followers. One idempotent line removes the
      # whole failure mode.
      - name: Make sure ffmpeg is available (for Reels)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Draft, vet and render
        id: draft
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. Leave this secret unset and sourcing just uses the free
          # citations + open-access fallback (sources.engagement_proxy) - a
          # real Altmetric attention score only kicks in once this exists.
          ALTMETRIC_API_KEY: ${{ secrets.ALTMETRIC_API_KEY }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
          HANDLE: ${{ vars.HANDLE }}
          THEME: ${{ vars.THEME }}
          ALLOW_PREPRINTS: ${{ vars.ALLOW_PREPRINTS }}
          # Which weekdays go out as a Reel. Unset falls back to "wildcard"
          # (Friday) - see pipeline.reel_niches(). Set it to "off" to disable;
          # an EMPTY value means unset here, not off.
          REEL_NICHES: ${{ vars.REEL_NICHES }}
          # The two "Run workflow" inputs come in as environment variables and
          # are read as shell variables below. They are NOT written into the
          # script with ${{ }}, which would paste whatever was typed in the box
          # straight into the command line - GitHub's documented script
          # injection hole. Only someone with write access to this repo can
          # start a workflow_dispatch, so this was never open to the public,
          # but the box is a text field and the shell should not trust it.
          INPUT_NICHE: ${{ inputs.niche }}
          INPUT_DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${INPUT_NICHE:-}" ]; then
            case "$INPUT_NICHE" in
              nature|psych|health|physics|wildcard) ARGS+=(--niche "$INPUT_NICHE") ;;
              *) echo "Refusing to run: unrecognised niche '$INPUT_NICHE'"; exit 1 ;;
            esac
          fi
          if [ -n "${INPUT_DAYS:-}" ]; then
            case "$INPUT_DAYS" in
              ''|*[!0-9]*) echo "Refusing to run: days must be a whole number"; exit 1 ;;
              *) ARGS+=(--days "$INPUT_DAYS") ;;
            esac
          fi
          python src/pipeline.py run "${ARGS[@]}" | tee run.log
          # Read the id straight out of THIS run's own "-> queued <id>" line
          # (pipeline.py run()), not a directory listing. A plain `ls
          # data/queue/*.json | head -1` picks whatever file sorts first
          # alphabetically - and killing a post only ever changes its status
          # field, it never deletes the file - so an old rejected post with
          # an earlier date prefix would permanently win that pick and get a
          # fresh review issue opened for IT every run, while whatever this
          # run actually just drafted silently never got reviewed at all.
          NEW_ID=$(grep -oP '(?<=-> queued )\S+' run.log | tail -1 || true)
          NEW=""
          if [ -n "$NEW_ID" ]; then
            NEW="data/queue/${NEW_ID}.json"
          fi
          echo "post_file=$NEW" >> "$GITHUB_OUTPUT"

      - name: Stage slide JPEGs for GitHub Pages
        if: steps.draft.outputs.post_file != ''
        env:
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
        run: |
          python - <<'PY'
          import json, glob, sys
          sys.path.insert(0, "src")
          from pathlib import Path
          from publish import to_jpeg
          from config import DOCS
          for f in glob.glob("data/queue/*.json"):
              post = json.loads(Path(f).read_text())
              pngs = sorted(str(p) for p in Path("out/posts", post["id"]).glob("*.png"))
              if pngs:
                  to_jpeg(pngs, DOCS / "img" / post["id"])
                  print("staged", post["id"], len(pngs))
          PY

      # Hardened to match scheduled-publish.yml's commit step. This one never
      # got the 24 Aug treatment, and it now carries reel.mp4 as well as the
      # queue file and the slide JPEGs.
      #
      # `git commit || echo "nothing to commit"` turns a REAL commit failure
      # into a green step - then `git push` succeeds vacuously ("Everything
      # up-to-date") and the next step opens a review issue for a queue file
      # that is not in the repository. tests/test_audit_regressions.py already
      # forbids that exact pattern in scheduled-publish.yml; it simply never
      # looked at this file.
      #
      # The retry matters more now than it did: publish-on-approve.yml commits
      # whenever you comment on an issue and shares no concurrency group with
      # this workflow, so a non-fast-forward rejection here is ordinary rather
      # than exotic - and it used to lose the whole day's draft.
      - name: Commit the queue
        if: steps.draft.outputs.post_file != ''
        run: |
          set -uo pipefail
          git config user.name  "onestudytoday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ out/ || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # No `|| true`: a commit that genuinely FAILS must not be mistaken
          # for "nothing to commit".
          git commit -m "draft: $(date -u +%Y-%m-%d) queue"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) - rebasing onto origin"
            git fetch origin "$GITHUB_REF_NAME"
            # A draft adds new files rather than editing existing ones, so a
            # rebase here is safe: unlike the publish path there is no ledger
            # edit to conflict on.
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
            sleep $(( attempt * 3 ))
          done
          echo "FAILED to push the draft after 5 attempts."
          exit 1

      - name: Open the review issue
        if: steps.draft.outputs.post_file != ''
        uses: actions/github-script@v7
        env:
          POST_FILE: ${{ steps.draft.outputs.post_file }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
        with:
          script: |
            // execFileSync, not execSync: the arguments are passed to python as
            // a list instead of being pasted into a shell command line, so a
            // filename or a Pages URL can never turn into a second command.
            const { execFileSync } = require("child_process");
            const fs = require("fs");
            const post = JSON.parse(fs.readFileSync(process.env.POST_FILE, "utf8"));
            const body = execFileSync(
              "python",
              ["src/issue.py", process.env.POST_FILE, process.env.PUBLIC_IMAGE_BASE || ""],
              { encoding: "utf8", maxBuffer: 10 * 1024 * 1024 });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `REVIEW ${post.niche} · ${post.cover.headline.replace(/\*\*/g, "").slice(0, 80)}`,
              body,
              labels: ["review", post.niche]
            });

      - name: Report when nothing survived vetting
        if: steps.draft.outputs.post_file == ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const log = fs.existsSync("run.log") ? fs.readFileSync("run.log", "utf8") : "";
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `No post today — nothing cleared vetting`,
              body: "Every candidate was rejected or the sources returned nothing.\n\n"
                  + "```\n" + log.slice(-6000) + "\n```\n\n"
                  + "Re-run with a wider window: Actions → Draft today's post → "
                  + "Run workflow → days = 21.",
              labels: ["no-post"]
            });
