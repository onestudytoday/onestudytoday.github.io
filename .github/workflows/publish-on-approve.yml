name: Publish on approval

# The human gate. Fires only when the repository owner comments "approve" on a
# review issue. Anyone else commenting does nothing.
#
# Comments understood:
#   approve         publish it
#   force approve   publish it even though a blocker is flagged
#   kill            reject and add to the do-not-use ledger

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  gate:
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'review') &&
      github.event.comment.user.login == github.repository_owner &&
      (
        startsWith(github.event.comment.body, 'approve') ||
        startsWith(github.event.comment.body, 'force approve') ||
        startsWith(github.event.comment.body, 'kill')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Work out which post and which action
        id: what
        env:
          BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          POST_ID=$(printf '%s' "$BODY" | grep -oP '(?<=onestudytoday-post-id: )[^\s]+' | head -1)
          echo "post_id=$POST_ID" >> "$GITHUB_OUTPUT"
          C=$(printf '%s' "$COMMENT" | tr '[:upper:]' '[:lower:]')
          case "$C" in
            force\ approve*) echo "action=force" >> "$GITHUB_OUTPUT" ;;
            approve*)        echo "action=approve" >> "$GITHUB_OUTPUT" ;;
            kill*)           echo "action=kill" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Kill it
        if: steps.what.outputs.action == 'kill'
        run: python src/review.py reject "${{ steps.what.outputs.post_id }}" "killed from issue"

      - name: Approve it
        if: steps.what.outputs.action == 'approve'
        run: python src/review.py approve "${{ steps.what.outputs.post_id }}"

      - name: Force approve it
        if: steps.what.outputs.action == 'force'
        run: python src/review.py force-approve "${{ steps.what.outputs.post_id }}"

      - name: Publish to Instagram
        id: pub
        if: steps.what.outputs.action != 'kill'
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
          HANDLE: ${{ vars.HANDLE }}
        run: |
          set -o pipefail
          python src/pipeline.py publish-approved --live | tee publish.log

      - name: Rebuild the link-in-bio page
        if: steps.what.outputs.action != 'kill'
        env:
          HANDLE: ${{ vars.HANDLE }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: python src/linkinbio.py

      - name: Commit the result
        run: |
          git config user.name  "onestudytoday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          git commit -m "publish: ${{ steps.what.outputs.post_id }} (${{ steps.what.outputs.action }})" || echo "nothing to commit"
          git push

      - name: Close the issue with the outcome
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const act = "${{ steps.what.outputs.action }}";
            let msg;
            if (act === "kill") {
              msg = "Killed. Added to the do-not-use ledger so it will never be sourced again.";
            } else {
              const log = fs.existsSync("publish.log") ? fs.readFileSync("publish.log", "utf8") : "";
              msg = "Published.\n\n```json\n" + log.slice(-3000) + "\n```\n\n"
                  + "The link-in-bio page has been rebuilt.";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: msg });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: "closed" });
