name: Apply an edited post document

# Edit the copy, commit, and the post updates itself.
#
# Every drafted post gets a plain Markdown file beside it -
# data/queue/<post-id>.md - carrying the kicker, headline, every slide, the
# caveats, the CTA and the caption hook. Open it in GitHub's web editor on
# your phone, fix the sentence, commit. This reads it back into the post,
# re-renders the slides and updates the review card.
#
# WHY A FILE RATHER THAN A `revise:` COMMENT
# ==========================================
# `revise:` asks a model to make a change you described. That is the right
# tool for "make slide 3 punchier" and the wrong one for "it should say four
# hours, not five" - you end up describing an edit and then checking whether
# it happened. Here what you type is what gets rendered.
#
# YOUR EDITS ARE STILL CHECKED
# ============================
# The post is re-linted afterwards and the result recorded. Deleting a forced
# caveat - "only 40 people took part", "done in mice" - leaves the post
# BLOCKED with that reason on the card rather than quietly publishing. That is
# not distrust of your typing: those caveats are promises the README makes on
# the account's behalf, and one deleted by accident on a train is still gone.
#
# It never calls a model and never publishes.

on:
  push:
    paths:
      - "data/queue/*.md"

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-edits
  cancel-in-progress: false

jobs:
  apply:
    # Do not answer our own commits.
    #
    # This workflow commits the JSON and the re-rendered slides; the daily
    # draft commits the .md in the first place; and `revise`, `revert` and the
    # clipping toggle all rewrite the .md so it keeps matching the post.
    # Without a guard the draft's commit would trigger an apply, whose commit
    # would look like another edit, and so on.
    #
    # THE AUTHOR IS THE PRIMARY SIGNAL, not the message prefix.
    #
    # The prefix list was the original guard and it was already wrong: adding
    # the clipping toggle added a commit message nobody thought to list here,
    # and that commit rewrites data/queue/*.md. It would have triggered an
    # apply, and apply_markdown() sets status back to needs_review - so
    # hiding a quotation would have quietly un-approved an approved post.
    #
    # Every automated commit in this repo is made by onestudytoday-bot, and
    # every edit that SHOULD trigger this job is made by a human in GitHub's
    # web editor under their own name. So the author is the durable signal and
    # the prefixes stay only as a second line of defence.
    if: >
      github.event.head_commit.author.name != 'onestudytoday-bot' &&
      !startsWith(github.event.head_commit.message, 'draft:') &&
      !startsWith(github.event.head_commit.message, 'edit:') &&
      !startsWith(github.event.head_commit.message, 'publish:') &&
      !startsWith(github.event.head_commit.message, 'clipping:') &&
      !startsWith(github.event.head_commit.message, 'revise:') &&
      !startsWith(github.event.head_commit.message, 'revert:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep enough to diff the whole PUSH, not just its last commit.
          # fetch-depth: 2 plus `git diff HEAD~1 HEAD` only ever saw the tip:
          # a reviewer who fixed post A, committed, fixed post B, committed,
          # then pushed had A's edits silently discarded on a green run.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Which documents changed
        id: which
        env:
          # The full range this push covers. `before` is all-zeroes for a
          # brand-new branch, which the script falls back on.
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, subprocess

          def git(*args):
              r = subprocess.run(["git", *args], capture_output=True, text=True)
              return r.stdout.split() if r.returncode == 0 else None

          before, after = os.environ.get("BEFORE", ""), os.environ.get("AFTER", "HEAD")
          # Names come from git, not from the push payload, so a rename or a
          # multi-file commit is handled the same way. The RANGE is the whole
          # push: diffing only HEAD~1..HEAD dropped every commit but the last,
          # so a reviewer who fixed two posts and pushed once had the first
          # one's edits thrown away on a run that reported success.
          out = None
          if before and set(before) != {"0"}:
              out = git("diff", "--name-only", f"{before}..{after}", "--",
                        "data/queue/*.md")
          if out is None:
              out = git("diff", "--name-only", "HEAD~1", "HEAD", "--",
                        "data/queue/*.md") or []

          ids = []
          for path in out:
              stem = os.path.basename(path)[:-3]
              # Same shape the publish gate insists on. These become directory
              # names and URL segments downstream.
              if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]{1,48}", stem):
                  if stem not in ids:
                      ids.append(stem)
          # Capped, and the cap is REPORTED rather than silently truncating.
          if len(ids) > 5:
              print("skipped=" + " ".join(ids[5:]))
              ids = ids[:5]
          print("ids=" + " ".join(ids))
          PY

      - name: Apply them
        if: steps.which.outputs.ids != ''
        id: apply
        env:
          IDS: ${{ steps.which.outputs.ids }}
          HANDLE: ${{ vars.HANDLE }}
          THEME: ${{ vars.THEME }}
          # Placeholders, not the real credentials - see the same comment in
          # publish-on-approve.yml. Re-rendering slides needs a Settings
          # object to exist; it does not need the ability to publish.
          META_APP_ID: edit-placeholder
          META_APP_SECRET: edit-placeholder
          IG_ACCESS_TOKEN: edit-placeholder
          IG_BUSINESS_ACCOUNT_ID: edit-placeholder
        run: |
          set -o pipefail
          # A failure is RECORDED, not swallowed.
          #
          # `|| true` alone meant an apply that raised - a document for a post
          # that no longer exists, a re-render that could not run - produced a
          # green step and a comment on the issue saying "your edits are in".
          # The run has to keep going so one bad document does not block the
          # others, so the failures are collected and reported at the end and
          # on the issue.
          : > failed.txt
          for id in $IDS; do
            echo "::group::$id"
            if ! python src/review.py apply-doc "$id" 2>&1 | tee -a apply.log; then
              echo "$id" >> failed.txt
              echo "::error::apply-doc failed for $id - this post is UNCHANGED"
            fi
            echo "::endgroup::"
          done

      - name: Rebuild the review cards
        if: steps.which.outputs.ids != ''
        env:
          IDS: ${{ steps.which.outputs.ids }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
        run: |
          BASE="${PUBLIC_IMAGE_BASE:-https://onestudytoday.github.io/img}"
          for id in $IDS; do
            if [ -f "data/queue/$id.json" ]; then
              python src/issue.py "data/queue/$id.json" "$BASE" > "body-$id.md"
            fi
          done

      - name: Commit the result
        if: steps.which.outputs.ids != ''
        env:
          IDS: ${{ steps.which.outputs.ids }}
        run: |
          git config user.name  "onestudytoday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          # The "edit:" prefix is what stops this commit retriggering the
          # workflow - see the job-level `if` above.
          git commit -m "edit: $IDS" || echo "nothing to commit"
          for attempt in 1 2 3; do
            git push && break
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            sleep $(( attempt * 3 ))
          done

      - name: Update the review issue for each edited post
        if: steps.which.outputs.ids != ''
        uses: actions/github-script@v7
        env:
          IDS: ${{ steps.which.outputs.ids }}
        with:
          script: |
            const fs = require("fs");
            const ids = process.env.IDS.trim().split(/\s+/).filter(Boolean);
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "review", per_page: 100 });
            for (const id of ids) {
              // The exact marker issue.py writes, never a raw id substring.
              const marker = `<!-- onestudytoday-post-id: ${id} -->`;
              const issue = issues.data.find(i => (i.body || "").includes(marker));
              if (!issue) continue;
              let body = "";
              try { body = fs.readFileSync(`body-${id}.md`, "utf8"); } catch {}
              if (body) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, body });
              }
              // Only claim the edits landed if they actually did. This
              // comment used to be posted unconditionally, so a post whose
              // apply raised was told "your edits are in - the card shows the
              // re-rendered slides" while both the post and the slides were
              // untouched.
              let failed = [];
              try {
                failed = fs.readFileSync("failed.txt", "utf8").trim().split(/\s+/);
              } catch {}
              const ok = !failed.includes(id);
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: ok
                  ? "Your edits are in - the card above shows the new copy and "
                    + "the re-rendered slides.\n\nIf anything is now flagged, it "
                    + "is in the checks above; the copy is yours, but a missing "
                    + "forced caveat still blocks publishing."
                  : "**Your edits were NOT applied - this post is unchanged.**\n\n"
                    + "Applying the document failed, so nothing was saved and the "
                    + "slides were not re-rendered. The reason is in the workflow "
                    + "log for this run. A slide heading renamed to something "
                    + "outside the set this account uses is the usual cause."
              });
            }
