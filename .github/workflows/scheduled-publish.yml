name: Publish approved posts

# Publishes whatever is approved and past its niche's peak-engagement slot
# (docs/GROWTH.md's weekly rhythm table), independent of when you actually
# reviewed it. Runs every 15 minutes rather than at one exact cron time, so
# it is never pinned to a UTC offset that drifts across daylight saving - the
# actual time check happens in Python against America/Chicago (see
# pipeline.publish_scheduled / pipeline.PUBLISH_TIMES).
#
# Run it by hand (Actions -> Publish approved posts -> Run workflow) to
# publish everything approved RIGHT NOW, ignoring the time gate - useful if
# you want something out immediately instead of waiting for its slot.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish whatever is due
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
          HANDLE: ${{ vars.HANDLE }}
        run: |
          set -o pipefail
          # GITHUB_EVENT_NAME is set automatically by Actions on every run -
          # no need to paste the event-name expression into the script to get it.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python src/pipeline.py publish-approved --live | tee publish.log
          else
            python src/pipeline.py publish-scheduled --live | tee publish.log
          fi

      - name: Rebuild the link-in-bio page
        env:
          HANDLE: ${{ vars.HANDLE }}
        run: python src/linkinbio.py

      - name: Find which posts just went live
        id: published
        run: |
          IDS=$(git status --porcelain data/published \
            | awk '{print $2}' | xargs -n1 basename 2>/dev/null \
            | sed 's/\.json$//' | tr '\n' ' ')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Commit the result
        run: |
          git config user.name  "onestudytoday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          git commit -m "publish: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push

      - name: Comment on the review issue for each post that went live
        if: steps.published.outputs.ids != ''
        uses: actions/github-script@v7
        env:
          IDS: ${{ steps.published.outputs.ids }}
        with:
          script: |
            const fs = require("fs");
            const ids = process.env.IDS.trim().split(/\s+/).filter(Boolean);
            const log = fs.existsSync("publish.log") ? fs.readFileSync("publish.log", "utf8") : "";
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "all", labels: "review", per_page: 100 });
            for (const id of ids) {
              // Matching on the exact marker issue.py writes, same as
              // publish-on-approve.yml - never on a raw id substring.
              const marker = `<!-- onestudytoday-post-id: ${id} -->`;
              const issue = issues.data.find(i => (i.body || "").includes(marker));
              if (!issue) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "Published.\n\n```\n" + log.slice(-2000) + "\n```\n\n" +
                      "The link-in-bio page has been rebuilt." });
              if (issue.state !== "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: "closed" });
              }
            }
