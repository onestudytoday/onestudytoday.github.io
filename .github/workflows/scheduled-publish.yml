name: Publish approved posts

# Publishes whatever is approved and past its niche's peak-engagement slot
# (docs/GROWTH.md's weekly rhythm table), independent of when you actually
# reviewed it. Runs every 15 minutes rather than at one exact cron time, so
# it is never pinned to a UTC offset that drifts across daylight saving - the
# actual time check happens in Python against America/Chicago (see
# pipeline.publish_scheduled / pipeline.PUBLISH_TIMES).
#
# Run it by hand (Actions -> Publish approved posts -> Run workflow) to
# publish everything approved RIGHT NOW, ignoring the time gate - useful if
# you want something out immediately instead of waiting for its slot.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit step below rebases onto origin before retrying a
          # rejected push. The default shallow clone (fetch-depth: 1) cannot
          # rebase, so the retry would fail exactly when it is needed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish whatever is due
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          PUBLIC_IMAGE_BASE: ${{ vars.PUBLIC_IMAGE_BASE }}
          HANDLE: ${{ vars.HANDLE }}
          # Reels: decides whether this post publishes as a Reel or a carousel.
          # It must match daily-draft.yml's value, because that is the run that
          # decided whether to BUILD a reel.mp4 at all. If they disagree the
          # publish step finds no video and falls back to a carousel, which is
          # safe but silently wastes the Reel.
          REEL_NICHES: ${{ vars.REEL_NICHES }}
          # Crossposting. All four are optional: an unset platform is SKIPPED
          # and says so in the log, and a crosspost failure can never fail this
          # job (see crosspost.crosspost_all). Bluesky needs only an app
          # password; Threads needs its own Meta app - see docs/RUNBOOK.md.
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
        run: |
          set -o pipefail
          # GITHUB_EVENT_NAME is set automatically by Actions on every run -
          # no need to paste the event-name expression into the script to get it.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python src/pipeline.py publish-approved --live | tee publish.log
          else
            python src/pipeline.py publish-scheduled --live | tee publish.log
          fi

      - name: Rebuild the link-in-bio page
        env:
          HANDLE: ${{ vars.HANDLE }}
        run: python src/linkinbio.py

      # always(), and BEFORE the commit step's `git add`: a post that went
      # live before a later failure should still get its issue comment.
      - name: Find which posts just went live
        id: published
        if: always()
        run: |
          IDS=$(git status --porcelain data/published \
            | awk '{print $2}' | xargs -n1 basename 2>/dev/null \
            | sed 's/\.json$//' | tr '\n' ' ')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      # if: always() is the whole point of this step, not a detail.
      #
      # Publishing to Instagram is irreversible the moment the Graph API
      # accepts it, but the record that it happened - data/published/<id>.json,
      # the deleted queue file, the ledger entry - is only written to this
      # runner's disk. THIS step is what makes that record durable. Gated on
      # success, any later failure (a second post erroring, the link-in-bio
      # rebuild, the porcelain step) threw the record away while the carousel
      # stayed live, and the next 15-minute poll published it all over again.
      #
      # The push is retried with a rebase because publish-on-approve.yml
      # commits an approval whenever you comment on an issue, and a plain push
      # from here is then rejected as non-fast-forward. That rejection used to
      # be enough, on its own, to duplicate a post.
      - name: Commit the result
        if: always()
        run: |
          set -uo pipefail
          # Written once, up here, because a heredoc cannot be indented inside
          # the retry loop below without breaking its terminator.
          cat > /tmp/reconcile.py <<'PY'
          """Resolve a merge conflict in favour of KEEPING the publish record.

          data/ledger.json is written by every workflow - this one adds to
          "posted", the approve/kill gate adds to "rejected", the morning draft
          adds to "seen". json.dumps(indent=2) puts those edits on adjacent
          lines, so while the ledger is still small git cannot auto-merge them
          and a plain rebase aborts. That is worst on a young account and eases
          as the file grows, which is exactly backwards.

          The ledger is a union of additive maps, so merge it as one. For any
          other conflicting path our side wins, because our side is the only
          record that a carousel is ALREADY LIVE on Instagram - and losing a
          "rejected"/"seen" entry just means a study may be re-sourced later,
          while losing a "posted" entry means posting the same carousel twice.
          """
          import json, subprocess

          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True)

          unmerged = sh("git", "diff", "--name-only", "--diff-filter=U").stdout.split()
          for path in unmerged:
              if path.endswith("ledger.json"):
                  def side(rev):
                      r = sh("git", "show", f"{rev}:{path}")
                      try:
                          return json.loads(r.stdout)
                      except Exception:
                          return {}
                  ours, theirs = side("HEAD"), side("MERGE_HEAD")
                  merged = {}
                  for bucket in ("posted", "rejected", "seen"):
                      merged[bucket] = {**(theirs.get(bucket) or {}),
                                        **(ours.get(bucket) or {})}
                  with open(path, "w") as fh:
                      json.dump(merged, fh, indent=2)
                  sh("git", "add", "--", path)
                  print(f"  union-merged {path}")
              elif sh("git", "checkout", "--ours", "--", path).returncode == 0:
                  sh("git", "add", "--", path)
                  print(f"  kept our {path}")
              else:
                  # We deleted it (a published post's queue file). Stay deleted.
                  sh("git", "rm", "-f", "--", path)
                  print(f"  kept our deletion of {path}")
          PY

          git config user.name  "onestudytoday-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/ || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # No `|| true` here: a commit that genuinely FAILS must not be
          # mistaken for "nothing to commit" and silently discard the record.
          git commit -m "publish: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) - reconciling with origin"
            git fetch origin "$GITHUB_REF_NAME"
            if ! git merge --no-edit "origin/$GITHUB_REF_NAME"; then
              python3 /tmp/reconcile.py
              git commit --no-edit || true
            fi
            sleep $(( attempt * 3 ))
          done
          echo "FAILED to push the publish record after 5 attempts."
          echo "Posts may already be live on Instagram without being recorded."
          exit 1

      # scheduled-publish.yml had no failure alert at all. A red run in the
      # Actions tab is not a notification - and this is the one workflow whose
      # silent failure can put the same carousel out twice.
      - name: Shout if publishing failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Publishing FAILED - check before the next run";
            const body = [
              "The scheduled publish run did not finish cleanly.",
              "",
              "**A post may already be live on Instagram without having been",
              "recorded in the repo.** The publish path refuses to repost",
              "anything it can see a record for, so check that first:",
              "",
              "1. Open the account and see what actually went out.",
              "2. If a post is live but `data/published/` has no file for it,",
              "   say so here and it can be recorded by hand before the next",
              "   15-minute run.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "publish-alert" });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["publish-alert"] });
            }

      - name: Comment on the review issue for each post that went live
        if: always() && steps.published.outputs.ids != ''
        uses: actions/github-script@v7
        env:
          IDS: ${{ steps.published.outputs.ids }}
        with:
          script: |
            const ids = process.env.IDS.trim().split(/\s+/).filter(Boolean);
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "all", labels: "review", per_page: 100 });
            for (const id of ids) {
              // Matching on the exact marker issue.py writes, same as
              // publish-on-approve.yml - never on a raw id substring.
              const marker = `<!-- onestudytoday-post-id: ${id} -->`;
              const issue = issues.data.find(i => (i.body || "").includes(marker));
              if (!issue) continue;
              // The publish log is NOT pasted in here any more.
              //
              // It used to paste the tail of publish.log. The Graph API
              // takes access_token as a QUERY PARAMETER, so a network-level
              // failure makes requests quote the whole URL - token included -
              // into an exception, which gets printed and tee'd into this
              // file. Actions secret masking does not cover it: masking
              // applies to the workflow LOG STREAM, not to bytes a process
              // writes to a file, and not to payloads sent to the REST API.
              // This comment body is a REST payload on a PUBLIC repository.
              //
              // src/secrets_guard.py now scrubs credentials before they can
              // reach the log at all. This is the second lock on that door:
              // the run link gives the same diagnostics to anyone who can
              // already read the logs, without republishing them to the world.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "Published.\n\nThe link-in-bio page has been rebuilt.\n\n" +
                      `[Full publish log](${context.serverUrl}/${context.repo.owner}` +
                      `/${context.repo.repo}/actions/runs/${context.runId})` });
              if (issue.state !== "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: "closed" });
              }
            }
