# ---------------------------------------------------------------------------
# THE POST TEMPLATE, as enforceable numbers.
#
# These are not style suggestions. draft.py passes them to the model, then
# validates the returned copy against them and retries on violation. The
# renderer is designed around these exact ranges - go outside them and text
# starts shrinking to stay inside the safe area.
#
# Word counts were set by rendering at 1080x1350 and finding the point where
# Poppins Bold stops being readable on a phone held at arm's length.
# ---------------------------------------------------------------------------

carousel:
  slides_min: 5
  slides_max: 8
  # THE ORDER, and why it is this one.
  #
  # The cover used to carry the finding and nothing said why a stranger should
  # care. So the cover now carries the IMPLICATION - the one line that answers
  # "why do we even care" - slide 2 explains that same implication properly,
  # and the finding follows on slide 3, where the numbers belong.
  #
  # Saying it twice is the point, not an accident: the cover is what a scroller
  # sees for 400 milliseconds, and slide 2 is what someone who stopped reads.
  # One has to work stripped of all context; the other has to earn it. The
  # reader is given the reason to care BEFORE the evidence for it, because a
  # reader who does not care does not reach the evidence.
  order:
    - cover          # 1  the implication, in one line. why anyone should care.
    - implications   # 2  the same implication, explained. why you should care.
    - finding        # 3  what the study actually found, with the numbers
    - clipping       # 4  optional, a published parallel to the implication
    - context        # 5  optional, the setup, the method or the mechanism
    - context_extra  # 6  optional
    - caveats        # 7  ALWAYS present. non-negotiable.
    - cta            # 8  send + link to the paper

fields:

  cover.kicker:
    words: [3, 7]
    chars_max: 44
    rule: "Journal name plus the one contextual detail that makes it credible.
           Example: 'Nature · 42,000 adults, 9 years'."

  cover.headline:
    words: [9, 18]
    chars_max: 115
    sentences: [1, 2]
    accent_runs: [1, 1]          # exactly one **highlighted** phrase
    rule: "The IMPLICATION, not the finding. One sentence answering 'why
           should I care' that a smart 15-year-old understands instantly.
           The finding itself is slide 2. Never a question. Never a
           colon-title. The **highlighted** phrase carries the stake.
           If the implications slide is marked `inferred`, this sentence is
           our extrapolation too and must be conditional - lint enforces it."

  slide.eyebrow:
    # The union of every format's eyebrows below, PLUS labels that already
    # appear on published posts. render.py turns this string into a filename,
    # so anything outside this set has never been through that path - and
    # lint() rejects it, which is also what `revise` re-runs against an old
    # post. That is why the legacy labels stay: dropping "Why it matters"
    # would make thirteen already-published posts unrevisable.
    fixed_values: ["What they found", "Why this matters", "The setup", "The mechanism",
                   "What the data says", "Why you should care", "The assumption", "Why the difference",
                   "Results", "What it could mean", "What they did", "How it works",
                   "The result", "What it means for you", "What changes",
                   # legacy - shipped on live posts, or drafted under an older
                   # spec, and kept only so `revise` can still re-lint them
                   "Why it matters", "What it changes", "What came back"]

  slide.title:
    words: [10, 20]
    chars_max: 130
    rule: "A full sentence that could stand alone as a mini-headline."

  slide.body:
    words: [30, 40]
    paragraphs: [2, 2]
    rule: "Two paragraphs separated by a blank line. First paragraph sets the
           scene, second delivers the turn. Short sentences. No jargon that
           is not immediately defined in the same sentence."

  slide.stat.value:
    chars_max: 7
    rule: "One number that anchors the slide. '42,000' or '12' or '3.4x'."

  slide.stat.label:
    words: [4, 10]
    chars_max: 52

  caveats:
    count: [2, 4]
    words_each: [10, 24]
    rule: "Plain-English limits, not hedging. Every caveat the vetting engine
           marked as REQUIRED must appear, rewritten in this voice."

  cta.headline:
    words: [5, 10]
    chars_max: 58

  cta.sub:
    words: [8, 18]
    chars_max: 96

  caption:
    words: [12, 28]
    rule: "Opens with a line that repeats the hook in different words. Ends
           with the study link and a question that is answerable in four words."

voice:
  register: "Bold and punchy. Confident, never breathless."
  banned_openers: ["Scientists have discovered", "A new study shows",
                   "Researchers at", "In a groundbreaking", "Did you know"]
  banned_words: ["breakthrough", "revolutionary", "game-changer", "miracle",
                 "shocking", "mind-blowing", "unbelievable", "insane",
                 "proves", "proven", "cure"]
  banned_punctuation: ["!", "?!", "..."]
  emoji: false
  second_person_ok: true
  contractions: true
  sentence_length_target: 12        # average words per sentence

  # HOW HARD THE COPY IS TO READ, as a school year.
  #
  # "Write simply" has been in the drafting prompt since the beginning and the
  # account's published copy still reads at roughly a SECOND-YEAR UNIVERSITY
  # level, with one word in twelve running to four or more syllables. Asking
  # did not work, so style.py measures it and feeds the offending words back
  # into the rewrite loop.
  #
  # Flesch-Kincaid GRADE LEVEL, not reading ease, because the target is a
  # person rather than a number: 12 is a high-school senior. Reading ease was
  # the same measurement upside down and nobody can say what 55 means.
  #
  # A page can fail this two ways and the fixes differ, so both are measured:
  # long SENTENCES (grade level) and long WORDS (the percentage).
  reading_grade_max: 12
  long_word_max_pct: 7

  # Swaps to reach for first. Not a banned list - sometimes the technical word
  # IS the point of the post - but these are the ones that cost the most ease
  # for the least meaning in this account's own published copy.
  plain_swaps:
    administered: "given"
    approximately: "about"
    associated with: "linked to"
    demonstrated: "showed"
    elevated: "higher"
    facilitate: "help"
    implemented: "put in place"
    indicates: "suggests"
    individuals: "people"
    initiated: "started"
    methodology: "method"
    participants: "the people in the study"
    prior to: "before"
    subsequently: "then"
    sufficient: "enough"
    supplementation: "taking it as a supplement"
    therapeutic: "treatment"
    transcriptional: "gene-switching"

# ---------------------------------------------------------------------------
# POST FORMATS
#
# Every post used to be built from one skeleton: "The setup" -> "What they
# found" -> caveats -> CTA, in that order, with those exact eyebrow labels
# baked into the drafting schema's enum. That is the single biggest reason the
# copy reads as machine-written. Fifteen posts deep, the grid is visibly a
# template, and no amount of word-level polish fixes a repeated shape.
#
# So there are now four skeletons and the pipeline rotates them. `shape` and
# `cta_shape` go into the drafting prompt; `eyebrows` becomes the JSON schema
# enum for that draft, so the model physically cannot emit labels from a
# different format and quietly drift back to the default one.
#
# THE ORDER WITHIN `eyebrows` IS LOAD-BEARING and is the same for all four:
#
#   eyebrows[0]  slide 2 - THE IMPLICATION, explained. Carries `basis`.
#   eyebrows[1]  slide 3 - THE FINDING. What the study measured, with numbers.
#   eyebrows[2:] slides 4+ - the rest: setup, method, mechanism.
#
# The cover sits above all of them and carries the implication in one line, so
# the post opens on the stake, explains it, then proves it. draft.py reads
# these by index to build the prompt; reordering this list reorders the post.
#
# The first two were the other way round until 24 Sep. The finding came second
# and the explanation third, on the reasoning that a claim should be proved
# before it is expanded on. In practice that spends the slide right after the
# hook on numbers, to a reader who has not yet been told why the numbers
# matter - so the explanation moved in front of it.
#
# Adding a format: add the eyebrows to fields."slide.eyebrow".fixed_values as
# well. render.py lowercases the eyebrow into a PNG filename, so keep them
# ASCII, no punctuation, no slashes. Keep the four labels distinguishable from
# each other - two near-identical ones ("What it changes" next to "What
# changes") read as a rendering bug.
# ---------------------------------------------------------------------------
formats:

  - name: explainer
    eyebrows: ["Why this matters", "What they found", "The setup", "The mechanism"]
    shape: >-
      Deliver the result plainly, explain why it matters to someone outside
      the field, then give the tension the study was resolving.
    cta_shape: >-
      Name the single thing a reader now knows that they did not know before
      opening the post.

  - name: reversal
    eyebrows: ["Why you should care", "What the data says", "The assumption", "Why the difference"]
    shape: >-
      Give what was actually measured, then why that lands for the reader,
      then what a reasonable person would have assumed instead - stated
      plainly and without strawmanning it. The gap between the assumption and
      the data IS the post. Do not manufacture a reversal: if the study
      confirms the obvious, say so and make the interesting part how precisely
      it was pinned down.
    cta_shape: >-
      Address the reader who held the assumption, without mocking them.

  - name: procedural
    # "Results", not "What came back". Plain words beat clever ones on a label
    # a reader sees for half a second.
    eyebrows: ["What it could mean", "Results", "What they did", "How it works"]
    shape: >-
      Give the result, then what it could mean, then the concrete thing the
      researchers physically did - who, how many, for how long, in what. This
      is the format that earns trust, so keep the numbers close to the verbs.
    cta_shape: >-
      Point at the part of the method a sceptic would want to check.

  - name: stakes
    eyebrows: ["What it means for you", "The result", "What changes", "How it works"]
    shape: >-
      Give the finding and how much it actually moves, then the concrete
      consequence for one identifiable person. Be honest about the size of the
      effect; a small effect stated exactly is more interesting than a large
      one implied.
    cta_shape: >-
      Name who specifically should see this and why it is relevant to them.

# ---------------------------------------------------------------------------
# THE CTA SLIDE
#
# Rewritten to ask for a SEND rather than a follow. As of 2026 shares and
# sends to DMs are the most heavily weighted ranking signal on Instagram, with
# saves and comments behind them and likes close to noise - and this account's
# content ("one real study, stated honestly") is unusually well suited to
# being forwarded to a specific person. Nothing in the old CTA asked for that.
#
# The send prompt must NAME the study's subject. A generic "send this to a
# friend" is filler, fits any post on the account, and is rejected by
# style.py's cta check. Specificity is also what makes a send actually happen:
# people forward things to a particular person for a particular reason.
# ---------------------------------------------------------------------------
cta:
  ask: send
  rules:
    - "cta.headline asks the reader to send the post to a specific kind of
       person, and names something concrete from THIS study."
    - "Never 'send this to a friend' or 'tag someone who' - name the person by
       what they believe, argue, worry about, or keep bringing up."
    - "cta.sub carries the brand line and the link promise, not the ask."
    - "Never 'Follow for ...'. The follow is earned by the other six slides."
  sub_default: "One real study, every weekday. The full paper is linked in bio."
